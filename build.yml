name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Retarget v142 to v143
        shell: pwsh
        run: |
          Get-ChildItem -Filter *.vcxproj -Recurse | ForEach-Object {
            (Get-Content $_.FullName) -replace '<PlatformToolset>v142</PlatformToolset>', '<PlatformToolset>v143</PlatformToolset>' | Set-Content $_.FullName
          }

      - name: Build (x86 Release)
        run: msbuild hack.sln /p:Configuration=Release /p:Platform=x86 /m /verbosity:minimal

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hack-build
          path: |
            **/*.dll
            **/*.exe
          if-no-files-found: warn
