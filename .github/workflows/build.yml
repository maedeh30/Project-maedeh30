name: Build Loader Only

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # بیلد فقط و فقط پروژه‌ی لودر
      - name: Build Loader EXE (x86 Release)
        run: msbuild loader\loader.vcxproj /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v143 /m /verbosity:minimal

      - name: Prepare Output Folder
        shell: pwsh
        run: |
          mkdir build_output
          
          # پیدا کردن فایل لودر و کپی آن به پوشه خروجی
          $loader = Get-ChildItem -Path . -Filter "loader.exe" -Recurse | Select-Object -First 1
          if ($loader) {
              Copy-Item -Path $loader.FullName -Destination "build_output\loader.exe"
          } else {
              Write-Error "Loader.exe not found after build!"
              exit 1
          }

          # اگر DLL از قبل در ریپو هست، آن را هم کپی کن تا با لودر در یک پوشه باشد
          $dll = Get-ChildItem -Path . -Filter "Saman.dll" -Recurse | Select-Object -First 1
          if (-not $dll) {
              $dll = Get-ChildItem -Path . -Filter "hack.dll" -Recurse | Select-Object -First 1
          }
          if ($dll) {
              Copy-Item -Path $dll.FullName -Destination "build_output\Saman.dll"
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CS16-Loader
          path: build_output\
