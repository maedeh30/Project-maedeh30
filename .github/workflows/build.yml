name: Build CS 1.6 Complete Cheat

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Cheat DLL (x86 Release)
        run: msbuild hack.sln /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v143 /m /verbosity:minimal

      - name: Build Loader EXE (x86 Release)
        run: msbuild loader\loader.vcxproj /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v143 /m /verbosity:minimal

      - name: Prepare Output Folder
        run: |
          mkdir build_output
          
          # Find and copy the DLL (since TargetName was Saman, it should be Saman.dll)
          Get-ChildItem -Path . -Filter "Saman.dll" -Recurse | Select-Object -First 1 | Copy-Item -Destination "build_output\Saman.dll" -ErrorAction SilentlyContinue
          if (!(Test-Path "build_output\Saman.dll")) {
            Get-ChildItem -Path . -Filter "hack.dll" -Recurse | Select-Object -First 1 | Copy-Item -Destination "build_output\Saman.dll"
          }
          
          # Find and copy the Loader EXE
          Get-ChildItem -Path . -Filter "loader.exe" -Recurse | Select-Object -First 1 | Copy-Item -Destination "build_output\loader.exe"
          
          # Copy textures and routes
          Copy-Item -Path "hack\texture" -Destination "build_output\texture" -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path "hack\route" -Destination "build_output\route" -Recurse -ErrorAction SilentlyContinue

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CS16-Final-Cheat
          path: build_output\
