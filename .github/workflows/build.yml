name: Build CS 1.6 Complete Cheat

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Cheat DLL (x86 Release)
        run: msbuild hack.sln /p:Configuration=Release /p:Platform=x86 /m /verbosity:minimal

      - name: Build Loader EXE (x86 Release)
        run: msbuild loader\loader.vcxproj /p:Configuration=Release /p:Platform=x86 /p:PlatformToolset=v143 /m /verbosity:minimal

      - name: Prepare Output Folder
        run: |
          mkdir build_output
          
          # 1. Copy the DLL (Rename hack.dll to Saman.dll)
          copy x86\Release\hack.dll build_output\Saman.dll || copy Release\hack.dll build_output\Saman.dll
          
          # 2. Copy the Loader EXE (Since OutDir is ..\hack\, the exe is inside hack folder)
          copy hack\loader.exe build_output\loader.exe || copy x86\Release\loader.exe build_output\loader.exe
          
          # 3. Copy textures and routes
          xcopy hack\texture build_output\texture /E /I /Y
          xcopy hack\route build_output\route /E /I /Y

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CS16-Final-Cheat
          path: build_output\
